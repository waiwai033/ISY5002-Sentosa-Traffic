name: Collect eight traffic cameras

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Minutes to collect: 55 = campaign batch; 0 = one-round trial only'
        default: '55'
        required: true
  schedule:
    # Every hour at minute 21 (also minute 21 in Asia/Singapore).
    - cron: '21 * * * *'

permissions:
  contents: read

concurrency:
  group: traffic-collection
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.COLLECTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate campaign window
        id: window
        env:
          EVENT: ${{ github.event_name }}
          DURATION: ${{ inputs.duration_minutes || '0' }}
        run: |
          python - <<'PY'
          import os, sys
          from datetime import datetime, timezone
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from run_collection_week import load_plan
          plan, start, end, cameras = load_plan(Path('reference/collection_week.json'))
          now = datetime.now(timezone.utc)
          minutes = 55 if os.environ['EVENT'] == 'schedule' else float(os.environ['DURATION'])
          if not 0 <= minutes <= 55:
              raise SystemExit('Duration must be between 0 and 55 minutes')
          trial = os.environ['EVENT'] == 'workflow_dispatch' and minutes == 0
          run = trial or start <= now < end
          if not trial:
              minutes = max(0, min(minutes, (end - now).total_seconds() / 60))
          path = 'data/trial-eight-cameras' if trial else plan['output_dir']
          mode = 'One-round trial' if trial else 'Campaign batch (10-minute sampling)'
          status = 'Starting' if run else 'Skipped: outside campaign window'
          print(f'{status}: {mode}; duration={minutes:.2f} minutes; output={path}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'## {mode}\n\n{status}. Duration limit: {minutes:.2f} minutes.\n\n')
              summary.write(f'Output: `{path}`. Trigger: `{os.environ["EVENT"]}`.\n\n')
              summary.write('A manual run starts this batch only; future scheduled runs depend on GitHub cron.\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'run={str(run).lower()}\nminutes={minutes}\npath={path}\n')
          PY
      - name: Collect images and manifest
        if: steps.window.outputs.run == 'true'
        env:
          DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}
          LTA_API_KEY: ${{ secrets.LTA_API_KEY }}
          MINUTES: ${{ steps.window.outputs.minutes }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          minutes = float(os.environ['MINUTES'])
          command = [sys.executable, 'scripts/run_collection_week.py']
          command += ['--once'] if minutes == 0 else ['--max-runtime-minutes', str(minutes)]
          subprocess.run(command, check=True)
          PY
      - name: Preserve images and metadata
        if: always() && steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: traffic-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.window.outputs.path }}/images/
            ${{ steps.window.outputs.path }}/metadata/
            ${{ steps.window.outputs.path }}/manifest.csv
            ${{ steps.window.outputs.path }}/state.json
          if-no-files-found: warn
          retention-days: 30
